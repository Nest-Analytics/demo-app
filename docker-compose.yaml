services:
  app:
    build: .
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - appnet
  
  ngnix:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
        app:
          condition: service_healthy
    networks:
        - appnet
networks:
  appnet:
    driver: bridge
