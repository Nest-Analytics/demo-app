name: AKS deploy via GitHub Actions

on:
    push:
        branches:
            - main

permissions:
    contents: read
    id-token: write #Azure login ODIC token
    packages: write

env:
    AKS_CLUSTER_NAME: demo-aks-cluster
    K8S_DEPLOYMENT: demo-app-deployment
    IMAGE: ghcr.io/nest-analytics/demo-app
    RESOURCE_GROUP: containerrg
    K8S_MANIFEST: infra/aks

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v5
              with:
                    node-version: "24"
            - run: npm ci
            - run: npm run lint 
            - run: npm test
    build:
        runs-on: ubuntu-latest
        needs: test
        steps:
            - uses: actions/checkout@v7

            - uses: docker/login-action@v4
              with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}
            
            - name: Build and push image to GHCR
              run: |
                docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
                docker push "$IMAGE:${{ github.sha }}"
                docker push "$IMAGE:latest"

    deploy:
        runs-on: ubuntu-latest
        needs: build
        environment:
            name: prod
        steps:
            - uses: actions/checkout@v7

            - uses: azure/login@v3
              with:
                    client-id: ${{ vars.AZURE_CLIENT_ID }}
                    tenant-id: ${{ vars.AZURE_TENANT_ID }}
                    subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
            
            - name: Set kubeconfig
              run: |
                az aks get-credentials \
                    --resource-group $RESOURCE_GROUP \
                    --name $AKS_CLUSTER_NAME \
                    --overwrite-existing
            - name: Deploy to AKS
              run: |
                sed -i "s|${IMAGE}:latest|$IMAGE:${{ github.sha }}|g" $K8S_MANIFEST/deployment.yml
                kubectl apply -f $K8S_MANIFEST
                kubectl rollout status "deployment/$K8S_DEPLOYMENT" --timeout=120s
                