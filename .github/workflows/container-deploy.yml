name: Build and deploy to Container Apps

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: containerclassregistry
  APP_NAME: demo-app
  RESOURCE_GROUP: containerrg


jobs:
  # Gate: nothing builds or deploys unless lint and tests pass
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci
      - run: npm run lint
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image with ACR
        run: |
          az acr build --registry "$ACR_NAME" \
            --image "$APP_NAME:${{ github.sha }}" .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: prod
    steps:
      # Separate runner, so this job needs its own Azure login. No checkout needed
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    
        
      - name: Deploy to Container Apps
        run: |
            az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${ACR_NAME}.azurecr.io/${APP_NAME}:${{ github.sha }}" \
            --cpu 0.5 \
            --memory 1.0Gi \
            --min-replicas 1 \
            --max-replicas 3 \
            --target-port 3000