name: AKS deploy via GitHub Actions

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write # push to GHCR
  id-token: write # Azure OIDC, used by the deploy job

env:
  IMAGE: ghcr.io/nest-analytics/demo-app # GHCR rejects uppercase, so not Nest-Analytics
  RESOURCE_GROUP: containerrg
  AKS_CLUSTER: demo-aks-cluster
  K8S_DEPLOYMENT: demo-app-deployment
  K8S_MANIFESTS: infra/aks # applies deployment.yml and service.yml

jobs:
  # Gate: nothing builds or deploys unless lint and tests pass
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - run: npm ci
      - run: npm run lint
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      # GHCR is GitHub's own registry, so the built-in token authenticates it. No Azure here
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        run: |
          docker build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: prod
    steps:
      # Checkout is needed here: the manifest comes from the repo
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get kubeconfig for the cluster
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_CLUSTER" \
            --overwrite-existing

      - name: Roll out the new image
        run: |
          # Pin the manifest to this commit's image before applying, so apply and the
          # running spec agree. Using apply + "set image" made two rollouts per run.
          sed -i "s|${IMAGE}:latest|${IMAGE}:${{ github.sha }}|" "$K8S_MANIFESTS/deployment.yml"
          kubectl apply -f "$K8S_MANIFESTS"
          kubectl rollout status "deployment/$K8S_DEPLOYMENT" --timeout=180s
