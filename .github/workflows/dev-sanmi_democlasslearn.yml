# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - democlasslearn

on:
  push:
    branches:
      - dev-sanmi
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: Install, build, and test
        run: |
          npm install
          npm run build
          npm test

      # Ship only what the server needs at runtime: the built dist/, the server
      # itself, and package.json (its "type": "module" lets server.js use import).
      # server.js relies solely on Node built-ins, so no node_modules is required.
      - name: Assemble deployment package
        run: |
          mkdir release
          cp -r dist server.js package.json startup.sh release/
          cd release && zip -r ../release.zip . && cd ..

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'democlasslearn'
          slot-name: 'Production'
          package: release.zip
          startup-command: 'node server.js'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_0C156537C33D4458AA62BC47665291DE }}
