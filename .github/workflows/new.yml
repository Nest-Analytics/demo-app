name: Deploy to Azure

on:
 push:
    branches:
      - main

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Node.js version
              uses: actions/setup-node@v3
              with:
                node-version: '24.x'
            - name: Install dependencies
              run: npm install
            - name: Build the project
              run: npm run build
            - name: Run tests
              run: npm test