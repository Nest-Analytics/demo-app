apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app-deployment

spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: demo-app
          image: ghcr.io/nest-analytics/demo-app:3d34c5ca02589d8c905186a85a9875a19cec5bcd
          ports:
            - containerPort: 3000
  