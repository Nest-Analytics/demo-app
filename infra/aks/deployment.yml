apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app-deployment

spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: demo-app
          image: ghcr.io/nest-analytics/demo-app:e2e7c40aec56698996000b076c61d13f026883f9
          ports:
            - containerPort: 3000
  
